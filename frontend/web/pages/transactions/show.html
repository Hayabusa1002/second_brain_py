<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Transactions</title>
</head>
<body>
    <h1>Transactions</h1>

    <a href="/transactions/add">+ Add transaction</a> |
    <a href="/transactions/import">Import CSV / Excel</a> |
    <button id="btn-logout">Logout</button>

    <div id="filters">
        <label>
            View
            <select id="filter-account">
                <option value="">All accounts</option>
            </select>
        </label>

        <label>
            Type
            <select id="filter-type">
                <option value="">All</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </label>

        <label>
            Category
            <select id="filter-category">
                <option value="">All</option>
            </select>
        </label>

        <button id="btn-filter">Filter</button>
        <button id="btn-clear">Clear</button>
    </div>

    <table id="transactions-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Account</th>
                <th>Type</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Description</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script type="module" src="/static/js/transactions/show.js"></script>
</body>
</html>
