{% extends "base.html" %}

{% block title %}Transactions – Second Brain{% endblock %}

{% block content %}
    <h2>Transactions</h2>

    <p>
        <a href="/transactions/add">Add transaction</a>
    </p>

    <table>
        <thead>
            <tr>
                <th>Date</th>
                <th>Account</th>
                <th>Category</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody id="transactions-body">
            <!-- Autocompleted with JS -->
        </tbody>
    </table>
{% endblock %}

{% block scripts %}
    <script type="module" src="{{ url_for('static', path='/js/transactions/show.js') }}"></script>
{% endblock %}
