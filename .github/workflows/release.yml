name: Release — Build .zip

on:
  push:
    tags:
      - "v*.*.*"   # activate with tags like v1.0.0, v1.1.0, v2.0.0

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Build .zip
        run: |
          zip -r second_brain_v${{ github.ref_name }}.zip . \
            --exclude "*.git*" \
            --exclude "*/.venv/*" \
            --exclude "*/__pycache__/*" \
            --exclude "*/.pytest_cache/*" \
            --exclude "*/node_modules/*" \
            --exclude "*/test.db" \
            --exclude "*/.env"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Second Brain ${{ github.ref_name }}"
          body: |
            ## Second Brain ${{ github.ref_name }}

            ### Installation
            1. Extract the `.zip` file
            2. Copy `.env.example` to `.env` and configure your environment variables
            3. `cd backend && pip install -r requirements.txt`
            4. `uvicorn app.main:app --reload`
          files: second_brain_v${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}