{% extends "base.html" %}

{% block title %}Register – Second Brain{% endblock %}

{% block content %}
    <div class="page page-center">
        <div class="container container-tight py-4">
            <div class="text-center mb-4">
                <h2 class="h1">Second Brain</h2>
                <p class="text-secondary">Create your account</p>
            </div>
            <div class="card">
                <div class="card-body">
                    <form id="register-form">
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input name="name" type="text" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input name="email" type="email" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input name="password" type="password" class="form-control" required />
                        </div>
                        <p id="error-msg" class="text-danger small"></p>
                        <button type="submit" class="btn btn-primary w-100">Create account</button>
                    </form>
                </div>
            </div>
            <p class="text-center mt-3 text-secondary">
                Already have an account? <a href="/login">Sign in</a>
            </p>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script type="module" src="/static/js/auth/register.js"></script>
{% endblock %}
