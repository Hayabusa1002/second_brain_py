{% extends "base.html" %}

{% block title %}Change Password – Second Brain{% endblock %}

{% block nav %}
    {% include "features/navbar.html" %}
{% endblock %}

{% block content %}
<div class="page page-center">
    <div class="container container-tight py-4">
        <div class="text-center mb-4">
            <h2 class="h1">Change password</h2>
        </div>
        <div class="card">
            <div class="card-body">
                <form id="change-password-form">
                    <div class="mb-3">
                        <label class="form-label">Current password</label>
                        <input name="current_password" type="password" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">New password</label>
                        <input name="new_password" type="password" class="form-control" required />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Confirm new password</label>
                        <input name="confirm_password" type="password" class="form-control" required />
                    </div>
                    <p id="error-msg" class="text-danger small"></p>
                    <p id="success-msg" class="text-success small" style="display:none">Password updated successfully.</p>
                    <button type="submit" class="btn btn-primary w-100">Update password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script type="module" src="/static/js/auth/change_password.js"></script>
{% endblock %}
