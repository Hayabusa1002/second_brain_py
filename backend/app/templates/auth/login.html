{% extends "base.html" %}

{% block title %}Login – Second Brain{% endblock %}

{% block content %}
    <h2>Login</h2>

    <form id="login-form">
        <label>
            Email
            <input name="email" type="email" required />
        </label>

        <label>
            Password
            <input name="password" type="password" required />
        </label>

        <button type="submit">Log in</button>
    </form>

    <p id="error-msg" style="color:red;"></p>

    <p>
        Don't have an account?
        <a href="/register">Register</a>
    </p>
{% endblock %}

{% block scripts %}
    <script type="module" src="{{ url_for('static', path='/js/auth/login.js') }}"></script>
{% endblock %}
