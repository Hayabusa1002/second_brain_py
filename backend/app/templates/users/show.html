<!-- Table -->
<div class="card">
    <div class="card-body">
        <p id="users-empty-msg" class="text-secondary" style="display:none">No users yet.</p>
        <div class="table-responsive" id="users-table-wrapper">
            <table class="table table-vcenter card-table">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Created</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="users-tbody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Row template -->
<template id="user-row-template">
    <tr>
        <td class="col-name fw-bold"></td>
        <td class="col-email text-secondary"></td>
        <td class="col-role"><span class="badge"></span></td>
        <td class="col-status"><span class="badge"></span></td>
        <td class="col-date text-secondary"></td>
        <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary me-1 btn-edit">Edit</button>
            <button class="btn btn-sm btn-toggle-ban"></button>
            <button class="btn btn-sm btn-outline-danger ms-1 btn-delete"
                title="Eliminar usuario">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6l-1 14H6L5 6"></path>
                    <path d="M10 11v6M14 11v6"></path>
                    <path d="M9 6V4h6v2"></path>
                </svg>
            </button>
        </td>
    </tr>
</template>
