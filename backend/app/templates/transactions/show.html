{% extends "base.html" %}

{% block title %}Transactions – Second Brain{% endblock %}

{% block nav %}
    {% include "features/navbar.html" %}
{% endblock %}

{% block content %}
    <h2>Transactions</h2>

    <section id="filters">
        <label>
            Account
            <select id="filter-account">
                <option value="">All accounts</option>
            </select>
        </label>

        <label>
            Type
            <select id="filter-type">
                <option value="">All</option>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
            </select>
        </label>

        <label>
            Category
            <select id="filter-category">
                <option value="">All</option>
            </select>
        </label>

        <button id="btn-filter" type="button">Filter</button>
        <button id="btn-clear" type="button">Clear</button>
    </section>

    <section>
        <table id="transactions-table">
            <thead>
                <tr>
                    <th>Date</th>
                    <th>Account</th>
                    <th>Type</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Description</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>
{% endblock %}

{% block scripts %}
    <script type="module" src="{{ url_for('static', path='/js/transactions/show.js') }}"></script>
{% endblock %}
