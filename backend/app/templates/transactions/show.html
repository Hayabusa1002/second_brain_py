<!-- Filters -->
<div class="card mb-3">
    <div class="card-body">
        <div class="row g-2">
            <div class="col-md-3">
                <label class="form-label">Account</label>
                <select id="filter-account" class="form-select">
                    <option value="">All accounts</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Type</label>
                <select id="filter-type" class="form-select">
                    <option value="">All</option>
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                </select>
            </div>
            <div class="col-md-3">
                <label class="form-label">Category</label>
                <select id="filter-category" class="form-select">
                    <option value="">All</option>
                </select>
            </div>
            <div class="col-md-3">
               <label class="form-label">Search</label>
                <input id="filter-q" type="text" class="form-control" placeholder="Description...">
            </div>
            <div class="col-md-3">
                <label class="form-label">From</label>
                <input id="filter-date-from" type="date" class="form-control">
            </div>
            <div class="col-md-3">
                <label class="form-label">To</label>
                <input id="filter-date-to" type="date" class="form-control">
            </div>
            <div class="col-md-3 d-flex align-items-end gap-2">
                <button id="btn-filter" type="button" class="btn btn-primary w-50">Filter</button>
                <button id="btn-clear"  type="button" class="btn btn-outline-secondary w-50">Clear</button>
            </div>
            <div class="col-md-3 d-flex align-items-end">
                <div class="dropdown w-100">
                    <button class="btn btn-outline-secondary w-100 dropdown-toggle" type="button" data-bs-toggle="dropdown">
                        Export
                    </button>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" id="export-csv"  href="#">CSV</a></li>
                        <li><a class="dropdown-item" id="export-json" href="#">JSON</a></li>
                        <li><a class="dropdown-item" id="export-xlsx" href="#">Excel (XLSX)</a></li>
                        <li><a class="dropdown-item" id="export-pdf"  href="#">PDF</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Table -->
<div class="card">
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-vcenter card-table" id="transactions-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Account</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Amount</th>
                        <th>Description</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<!-- Row template -->
<template id="row-template">
    <tr>
        <td class="col-date"></td>
        <td class="col-account text-secondary"></td>
        <td class="col-type"></td>
        <td class="col-category text-secondary"></td>
        <td class="col-amount fw-bold"></td>
        <td class="col-description text-secondary"></td>
        <td class="text-end">
            <button class="btn btn-sm btn-outline-secondary me-1 btn-edit">Edit</button>
            <button class="btn btn-sm btn-danger btn-delete">Delete</button>
        </td>
    </tr>
</template>
