<!-- Add / Edit form (hidden by default) -->
<div id="edit-card" class="card mb-3" style="display:none">
    <div class="card-header">
        <h3 class="card-title" id="edit-card-title">Add transaction</h3>
    </div>
    <div class="card-body">
        <form id="transaction-form">
            <input type="hidden" id="transaction-id" />
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Account</label>
                    <select name="account_id" id="account-select" class="form-select"></select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Amount</label>
                    <input name="amount" type="number" step="0.01" min="0.01"
                           placeholder="0.00" class="form-control" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Type</label>
                    <select name="type" id="type-select" class="form-select">
                        <option value="expense">Expense</option>
                        <option value="income">Income</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Category</label>
                    <select name="category_id" id="category-select" class="form-select"></select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Date</label>
                    <input name="date" type="date" class="form-control" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label">Description</label>
                    <input name="description" type="text" placeholder="Optional" class="form-control" />
                </div>
            </div>
            <p id="edit-error" class="text-danger small mt-2"></p>
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-primary">Save</button>
                <button type="button" id="btn-edit-cancel" class="btn btn-outline-secondary">Cancel</button>
            </div>
        </form>
    </div>
</div>
