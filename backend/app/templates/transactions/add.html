{% extends "base.html" %}

{% block title %}Add Transaction – Second Brain{% endblock %}

{% block nav %}
    {% include "features/navbar.html" %}
{% endblock %}

{% block content %}
    <div class="page-header mb-3">
        <div class="row align-items-center">
            <div class="col">
                <h2 class="page-title">Add Transaction</h2>
            </div>
            <div class="col-auto">
                <a href="/" class="btn btn-outline-secondary btn-sm">← Back</a>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form id="transaction-form">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Account</label>
                        <select name="account_id" id="account-select" class="form-select"></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Amount</label>
                        <input name="amount" type="number" step="0.01" min="0.01"
                               placeholder="0.00" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Type</label>
                        <select name="type" id="type-select" class="form-select">
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Category</label>
                        <select name="category_id" id="category-select" class="form-select"></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Date</label>
                        <input name="date" type="date" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Description</label>
                        <input name="description" type="text" placeholder="Optional"
                               class="form-control" />
                    </div>
                    <div class="col-12">
                        <button type="submit" class="btn btn-primary">Save transaction</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script type="module" src="{{ url_for('static', path='/js/transactions/add.js') }}"></script>
{% endblock %}
