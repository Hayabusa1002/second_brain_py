{% extends "base.html" %}

{% block title %}Add Transaction – Second Brain{% endblock %}

{% block nav %}
    {% include "features/navbar.html" %}
{% endblock %}

{% block content %}
    <form id="transaction-form">
        <label>
            Account
            <select name="account_id" id="account-select"></select>
        </label>

        <label>
            Amount
            <input name="amount" type="number" step="0.01" min="0.01" placeholder="0.00" required />
        </label>

        <label>
            Type
            <select name="type" id="type-select">
                <option value="expense">Expense</option>
                <option value="income">Income</option>
            </select>
        </label>

        <label>
            Category
            <select name="category_id" id="category-select"></select>
        </label>

        <label>
            Date
            <input name="date" type="date" required />
        </label>

        <label>
            Description
            <input name="description" type="text" placeholder="Optional" />
        </label>

        <button type="submit">Save</button>
    </form>
{% endblock %}

{% block scripts %}
    <script type="module" src="{{ url_for('static', path='/js/transactions/add.js') }}"></script>
{% endblock %}
