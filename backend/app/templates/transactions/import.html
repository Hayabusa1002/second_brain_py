<!-- Import form (hidden by default) -->
<div id="import-card" class="card mb-3" style="display:none">
    <div class="card-header">
        <h3 class="card-title">Import transactions</h3>
    </div>
    <div class="card-body">
        <p class="text-secondary">
            Upload a <strong>.csv</strong> or <strong>.xlsx</strong> file with columns:
            de>date, amount, type, category, account, description</code>
        </p>
        <a href="/api/transactions/import/template" download
           class="btn btn-outline-secondary btn-sm mb-3">
            Download template CSV
        </a>
        <form id="import-form">
            <div class="mb-3">
                <input type="file" id="file-input" accept=".csv,.xlsx,.xls"
                       class="form-control" required />
            </div>
            <div id="import-result" style="display:none" class="mb-3">
                <p id="result-summary" class="text-secondary"></p>
                <div id="error-section" style="display:none">
                    <h5>Errors</h5>
                    <div class="table-responsive">
                        <table class="table table-sm">
                            <thead><tr><th>Row</th><th>Error</th></tr></thead>
                            <tbody id="error-table"></tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Import</button>
                <button type="button" id="btn-import-cancel" class="btn btn-outline-secondary">Cancel</button>
            </div>
        </form>
    </div>
</div>
