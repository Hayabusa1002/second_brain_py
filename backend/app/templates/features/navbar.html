<header class="navbar navbar-expand-md d-print-none">
    <div class="container-xl">

        <a href="/" class="navbar-brand">
            <span class="navbar-brand-text fw-bold">Second Brain</span>
        </a>

        <!-- Hamburger toggler (visible only on mobile) -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbar-menu"
                aria-controls="navbar-menu"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Collapsible nav links -->
        <div class="collapse navbar-collapse" id="navbar-menu">
            <div class="navbar-nav flex-row order-md-last ms-auto gap-2">
                {% if user and user.role.value == "admin" %}
                <a href="/access-requests" class="nav-link">Access requests</a>
                
                <a href="/users" class="nav-link">Users</a>
                {% endif %}

                <a href="/change-password" class="nav-link">Change password</a>

                <a href="/" class="nav-link">Transactions</a>

                <a href="/accounts" class="nav-link">Accounts</a>

                <!-- Dark / Light toggle -->
                <button id="btn-theme-toggle" type="button" class="btn btn-ghost-secondary btn-sm btn-icon" title="Toggle theme">
                    <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                        style="display:none">
                        ircle cx="12" cy="12" r="5"></circle>
                        e x1="12" y1="1" x2="12" y2="3"></line>
                        e x1="12" y1="21" x2="12" y2="23"></line>
                        e x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        e x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        e x1="1" y1="12" x2="3" y2="12"></line>
                        e x1="21" y1="12" x2="23" y2="12"></line>
                        e x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        e x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                        viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>

                <button id="btn-logout" type="button" class="btn btn-ghost-danger btn-sm">
                    Logout
                </button>
            </div>
        </div>

    </div>
</header>
