<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Second Brain{% endblock %}</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
</head>
<body class="antialiased">

    <!-- Apply saved theme before UI is printed -->
    <script>
        const saved = localStorage.getItem("theme") || "light"
        document.documentElement.setAttribute("data-bs-theme", saved)
    </script>

    <div class="wrapper">
        {% block nav %}{% endblock %}

        <div class="page-wrapper">
            <div class="page-body">
                <div class="container-xl">
                    {% block content %}{% endblock %}
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
    <script type="module" src="/static/js/auth/guard.js"></script>
    <script type="module" src="/static/js/features/theme.js"></script>
    <script src="/static/js/features/sw-register.js"></script>

    {% block scripts %}{% endblock %}
</body>
</html>
